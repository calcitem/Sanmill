# see https://flutter.dev/go/i18n-user-guide
# https://docs.google.com/document/d/10e0saTfAv32OZLRmONy866vnaw0I2jwL8zukykpgWBc/edit#
#
# Translation scope and quality are defined in the repository's
# .agents/skills/arb-translation-updater/SKILL.md. New keys use its
# en/de/hu/zh tail gate; do not fill other locales with English placeholders.
#
# Import the generated S class from the configured output directory:
# import 'package:sanmill/generated/intl/l10n.dart';

arb-dir: lib/l10n
template-arb-file: intl_en.arb
output-dir: lib/generated/intl/
output-localization-file: l10n.dart
output-class: S
untranslated-messages-file: untranslated-messages-file.txt
# use-deferred-loading: true #enable for web support
nullable-getter: false
